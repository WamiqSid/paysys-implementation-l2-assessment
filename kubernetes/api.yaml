apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-api
  namespace: minipay
  labels:
    app: minipay-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minipay-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: minipay-api
    spec:
      containers:
        - name: api
          image: minipay-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minipay-secrets
                  key: DATABASE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: minipay-secrets
                  key: API_KEY
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: minipay-config
                  key: LOG_LEVEL
            - name: BUGGY_SEARCH
              valueFrom:
                configMapKeyRef:
                  name: minipay-config
                  key: BUGGY_SEARCH
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-api
  namespace: minipay
spec:
  selector:
    app: minipay-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
