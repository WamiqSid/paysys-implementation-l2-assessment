# Copy of starter/kubernetes/broken-api.yaml with defects labelled.
# Do not apply this file. The corrected manifests live in api.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-api
  namespace: minipay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minipay-api
  template:
    metadata:
      labels:
        app: minipay-api
    spec:
      containers:
        - name: api
          image: YOUR_IMAGE_HERE                 # DEFECT: placeholder image, image pull will fail
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "minipay-db"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081                         # DEFECT: container listens on 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080                         # Inconsistent with readiness; /health also depends on DB
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-api
  namespace: minipay
spec:
  selector:
    app: minipay-backend                         # DEFECT: pods are labelled app=minipay-api
  ports:
    - port: 80
      targetPort: 8081                           # DEFECT: process port is 8080
