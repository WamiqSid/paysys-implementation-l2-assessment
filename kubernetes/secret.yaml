# Demo-only placeholders. Do not put real credentials here.
# Recreate from a gitignored file in any shared environment:
#   kubectl -n minipay create secret generic minipay-secrets --from-env-file=secret.env
apiVersion: v1
kind: Secret
metadata:
  name: minipay-secrets
  namespace: minipay
type: Opaque
stringData:
  POSTGRES_USER: minipay
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: minipay
  DATABASE_URL: postgresql+psycopg://minipay:change-me@minipay-db:5432/minipay
  API_KEY: change-me
