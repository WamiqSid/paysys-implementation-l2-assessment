apiVersion: v1
kind: Service
metadata:
  name: minipay-db
  namespace: minipay
spec:
  clusterIP: None
  selector:
    app: minipay-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minipay-db
  namespace: minipay
spec:
  serviceName: minipay-db
  replicas: 1
  selector:
    matchLabels:
      app: minipay-db
  template:
    metadata:
      labels:
        app: minipay-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: minipay-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minipay-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: minipay-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "minipay", "-d", "minipay"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "minipay", "-d", "minipay"]
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: 01-schema.sql
      volumes:
        - name: schema
          configMap:
            name: minipay-db-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minipay-db-schema
  namespace: minipay
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS customers (
      id BIGSERIAL PRIMARY KEY,
      customer_ref VARCHAR(40) NOT NULL UNIQUE,
      name VARCHAR(120) NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS transactions (
      id BIGSERIAL PRIMARY KEY,
      transaction_ref VARCHAR(50) NOT NULL,
      customer_id BIGINT NOT NULL REFERENCES customers(id),
      amount NUMERIC(14,2) NOT NULL CHECK (amount > 0),
      status VARCHAR(20) NOT NULL CHECK (status IN ('PROCESSING','SUCCESS','FAILED')),
      created_at TIMESTAMP NOT NULL,
      completed_at TIMESTAMP NULL,
      failure_code VARCHAR(40) NULL
    );
    CREATE TABLE IF NOT EXISTS callbacks (
      id BIGSERIAL PRIMARY KEY,
      transaction_id BIGINT NOT NULL REFERENCES transactions(id),
      attempt_no INTEGER NOT NULL,
      http_status INTEGER NULL,
      callback_status VARCHAR(20) NOT NULL CHECK (callback_status IN ('SUCCESS','FAILED')),
      attempted_at TIMESTAMP NOT NULL,
      UNIQUE(transaction_id, attempt_no)
    );
