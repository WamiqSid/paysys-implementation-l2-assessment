name: minipay-ci

on:
  push:
  pull_request:

jobs:
  api-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest tests/api python/tests -q
      - name: Linux probe (no API required for uname block)
        run: uname -a && free -h && df -h | head
