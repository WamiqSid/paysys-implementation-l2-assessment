<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniPay Operations</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Paysys Labs · L2 console</p>
      <h1>MiniPay Operations</h1>
    </div>
    <div id="auth-status" data-testid="auth-status" class="pill pill-warn">Signed out</div>
  </header>

  <main>
    <p id="error-banner" data-testid="error-banner" class="banner hidden" role="alert"></p>

    <section class="card" id="login-card">
      <h2>Operator sign-in</h2>
      <p class="muted">Authenticate with the MiniPay API key. Default local value is <code>minipay-dev-key</code>.</p>
      <form id="login-form">
        <label for="login-key">API key</label>
        <input id="login-key" data-testid="login-key" type="password" autocomplete="off" required />
        <button type="submit" data-testid="login-submit">Sign in</button>
      </form>
    </section>

    <section class="grid hidden" id="work-area">
      <article class="card">
        <h2>Search transaction</h2>
        <form id="search-form">
          <label for="search-input">Transaction reference</label>
          <input id="search-input" data-testid="search-input" placeholder="TXN00000001" required />
          <button type="submit" data-testid="search-submit">Search</button>
        </form>
        <div id="search-results" data-testid="search-results" class="results"></div>
      </article>

      <article class="card">
        <h2>Submit payment</h2>
        <form id="payment-form">
          <label for="payment-customer-id">Customer ID</label>
          <input id="payment-customer-id" data-testid="payment-customer-id" type="number" min="1" required />
          <label for="payment-amount">Amount</label>
          <input id="payment-amount" data-testid="payment-amount" type="number" step="0.01" min="0.01" required />
          <label for="payment-ref">Transaction ref (optional)</label>
          <input id="payment-ref" data-testid="payment-ref" />
          <button type="submit" data-testid="payment-submit">Submit payment</button>
        </form>
        <div id="payment-result" data-testid="payment-result" class="results"></div>
      </article>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
