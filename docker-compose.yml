services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: minipay
      POSTGRES_DB: minipay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay -d minipay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minipay-pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  api:
    build:
      context: ./minipay
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://minipay:minipay@db:5432/minipay
      API_KEY: minipay-dev-key
      LOG_LEVEL: INFO
      BUGGY_SEARCH: "false"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./minipay
    environment:
      DATABASE_URL: postgresql+psycopg://minipay:minipay@db:5432/minipay
      SEED_CUSTOMERS: "1000"
      SEED_TRANSACTIONS: "50000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "seed.py", "--reset"]
    profiles: ["seed"]

volumes:
  minipay-pg:
